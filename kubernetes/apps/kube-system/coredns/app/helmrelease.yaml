---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      coredns:
        # Talos skips DaemonSet pods when draining, so DNS stays up for Longhorn until kubelet shutdown
        type: daemonset
        strategy: RollingUpdate
        rollingUpdate:
          surge: 1
          unavailable: 0
        serviceAccount:
          identifier: coredns
        pod:
          labels:
            k8s-app: kube-dns
        containers:
          app:
            image:
              repository: mirror.gcr.io/coredns/coredns
              tag: 1.14.7
            args: ["-conf", "/etc/coredns/Corefile"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: 8181
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 1
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { add: ["NET_BIND_SERVICE"], drop: ["ALL"] }
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      automountServiceAccountToken: true
      dnsPolicy: Default
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    service:
      app:
        forceRename: kube-dns
        controller: coredns
        clusterIP: 10.43.0.10
        ports:
          udp-53:
            port: 53
            protocol: UDP
          tcp-53:
            port: 53
            protocol: TCP
          metrics:
            port: 9153
    serviceAccount:
      coredns: {}
    rbac:
      roles:
        coredns:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["endpoints", "services", "pods", "namespaces"]
              verbs: ["list", "watch"]
            - apiGroups: ["discovery.k8s.io"]
              resources: ["endpointslices"]
              verbs: ["list", "watch"]
      bindings:
        coredns:
          type: ClusterRoleBinding
          roleRef:
            identifier: coredns
          subjects:
            - identifier: coredns
    configMaps:
      config:
        data:
          Corefile: |-
            dns://.:53 {
                template ANY AAAA {
                    authority "{{ "{{" }} .Zone }} 60 IN SOA ns.dns.cluster.local. hostmaster.cluster.local. (1 60 60 60 60)"
                }
                errors
                health {
                    lameduck 5s
                }
                ready
                kubernetes cluster.local in-addr.arpa ip6.arpa {
                    pods verified
                    fallthrough in-addr.arpa ip6.arpa
                }
                autopath @kubernetes
                forward . /etc/resolv.conf
                cache {
                    prefetch 20
                    serve_stale
                    servfail 0
                }
                loop
                reload
                loadbalance
                prometheus 0.0.0.0:9153
                log {
                    class error
                }
            }
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/coredns
            readOnly: true
