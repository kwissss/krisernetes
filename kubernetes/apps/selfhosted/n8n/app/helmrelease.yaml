---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  chartRef:
    kind: OCIRepository
    name: n8n
  interval: 1h
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 3.2.0@sha256:9e67c2627d3c30dbb0d51f5da83d4499ac7913f6b4f358a900a58026a832ba12
            env:
              DB_SQLITE_VACUUM_ON_STARTUP: false # >4m+ startup time?
              EXECUTIONS_TIMEOUT: 600
              GENERIC_TIMEZONE: &timezone Europe/Oslo
              N8N_DIAGNOSTICS_ENABLED: false
              N8N_EDITOR_BASE_URL: "https://{{ .Release.Name }}.kris.party"
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
              N8N_VERSION_NOTIFICATIONS_ENABLED: false
              N8N_HIRING_BANNER_ENABLED: false
              N8N_METRICS: true
              N8N_LOG_FORMAT: json
              N8N_PORT: &port 80
              N8N_PROTOCOL: https
              N8N_PROXY_HOPS: 1
              N8N_RUNNERS_MODE: external
              N8N_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_ENCRYPTION_KEY
              N8N_RUNNERS_AUTH_TOKEN: &runnersAuthToken
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_RUNNERS_AUTH_TOKEN
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 300Mi
              limits:
                memory: 1Gi
          runners:
            image:
              repository: ghcr.io/n8n-io/runners
              tag: 3.2.0@sha256:121b0ae16e397b31dca8c9f188f44a611d75ed46bcda16bacc42381a4ea1ae90
            env:
              GENERIC_TIMEZONE: *timezone
              N8N_RUNNERS_AUTH_TOKEN: *runnersAuthToken
            probes:
              liveness: &runnersProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5680
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *runnersProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.kris.party"
        parentRefs:
          - name: envoy-external
            namespace: network
      api:
        hostnames:
          - "{{ .Release.Name }}-api.kris.party"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  value: /api
            backendRefs: [{}]
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n
      tmp:
        type: emptyDir
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.cache
              - path: /tmp
            runners:
              - path: /tmp
