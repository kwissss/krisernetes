---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mining-cult
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      mining-cult:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/duckysolucky/hypixel-discord-chat-bridge
              tag: latest@sha256:b797bd4c7d1f67b0db9d450ba67e9b7730d57eece83552da8ede7a8f72941818
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 300Mi
              limits:
                memory: 700Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: Always
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          mining-cult:
            app:
              - path: /app/data/auth-cache
                subPath: auth-cache/
              - path: /app/config.json
                subPath: config.json
              - path: /app/data
                subPath: data/
              - path: /app/node_modules/skyhelper-networth/.itemsBackup.json
                subPath: .itemsBackup.json
      tmp:
        type: emptyDir