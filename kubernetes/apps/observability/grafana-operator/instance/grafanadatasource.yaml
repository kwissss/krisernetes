---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: prometheus
    name: prometheus
    access: proxy
    isDefault: true
    url: http://prometheus-operated.observability.svc.cluster.local:9090
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: alertmanager
    name: alertmanager
    access: proxy
    jsonData:
      implementation: prometheus
    url: http://alertmanager-operated.observability.svc.cluster.local:9093
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  plugins:
    - name: victoriametrics-logs-datasource
      # renovate: datasource=custom.grafana-plugins depName=victoriametrics-logs-datasource
      version: 0.33.1
  datasource:
    type: victoriametrics-logs-datasource
    name: victoria-logs
    uid: victoria-logs
    access: proxy
    url: http://victoria-logs-server.observability.svc.cluster.local:9428
    jsonData:
      # Only used when a log has no level field with a known level name; the first match wins.
      # Exact formats (logfmt, zap, klog, Envoy) come before loose words so that a word in the message cannot win.
      logLevelRules:
        # 1Password Connect writes a numeric level
        - { field: level, operator: equals, value: "1", level: error }
        - { field: level, operator: equals, value: "2", level: warning }
        - { field: level, operator: equals, value: "3", level: info }
        - { field: level, operator: equals, value: "4", level: debug }
        - field: _msg
          operator: regex
          value: 'level="?(?:error|ERROR|fatal|FATAL|panic|PANIC)\b|\t(?:error|fatal|panic|dpanic)\t|^E\d{4} \d\d:|\]\[(?:error|critical)\]\['
          level: error
        - field: _msg
          operator: regex
          value: 'level="?(?:warn|WARN|warning|WARNING)\b|\twarn\t|^W\d{4} \d\d:|\]\[warning\]\['
          level: warning
        - field: _msg
          operator: regex
          value: 'level="?(?:info|INFO)\b|\tinfo\t|^I\d{4} \d\d:|\]\[info\]\['
          level: info
        - field: _msg
          operator: regex
          value: 'level="?(?:debug|DEBUG)\b|\tdebug\t|\]\[debug\]\['
          level: debug
        - field: _msg
          operator: regex
          value: '[ \[](?:ERR|FTL|PNC)[ \]]|\[(?:[Ee]rror|[Ff]atal)\]|\bERROR\b'
          level: error
        - field: _msg
          operator: regex
          value: '[ \[]WRN[ \]]|\[[Ww]arn\]|\bWARN(?:ING)?\b'
          level: warning
        - field: _msg
          operator: regex
          value: '[ \[]INF[ \]]|\[[Ii]nfo\]|\bINFO\b'
          level: info
        - field: _msg
          operator: regex
          value: '[ \[]DBG[ \]]|\[[Dd]ebug\]|\bDEBUG\b'
          level: debug
