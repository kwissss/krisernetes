---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.5
  policy:
    rebootMode: powercycle
  healthChecks:
    # Skipped after the drain: it can evict a mover and leave its phase behind.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        !has(status.phase) || status.phase != 'Running'
      skipAfterPreHooks: true
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !has(status.phase) || !(status.phase in ['Resolving', 'Restoring'])
      skipAfterPreHooks: true
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      expr: |-
        status.robustness == 'healthy' ||
        (status.state == 'detached' && status.robustness == 'unknown')
      skipAfterPreHooks: true
    - apiVersion: longhorn.io/v1beta2
      kind: Node
      expr: |-
        status.conditions.exists(c, c.type == 'Ready' && c.status == 'True') &&
        status.conditions.exists(c, c.type == 'Schedulable' && c.status == 'True')
      skipAfterPreHooks: true
  hooks:
    pre:
      # spec.drain stops at the first PDB refusal and uncordons. kubectl drain keeps
      # retrying, which lets Longhorn drop its PDBs once the volumes have detached.
      - name: drain
        image: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
        args:
          - drain
          - talos-01
          - --ignore-daemonsets
          - --delete-emptydir-data
          - --pod-selector=app.kubernetes.io/name!=tuppr,app.kubernetes.io/part-of!=tuppr
          - --timeout=9m
        serviceAccountName: tuppr-drain
    post:
      - name: uncordon
        image: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
        args:
          - uncordon
          - talos-01
        serviceAccountName: tuppr-drain
