---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: nas.internal
          path: /volume1/kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 2 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Kopia's default budgets (5000 MiB each) exceed a 5Gi cache PVC, so the
      # sweeper would never run; the metadata budget applies twice (index blobs too)
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
    # Kopiur's default fsGroup 65532 mismatches the app volumes' group 1000 and would
    # trigger a recursive chown; 1000 also owns the files written to the NFS share
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
