---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-web
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flux-operator-web-secret
    template:
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux-operator.kris.party
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: "{{ .FLUX_OIDC_CLIENT_ID }}"
                clientSecret: "{{ .FLUX_OIDC_CLIENT_SECRET }}"
                issuerURL: https://id.kris.party
  dataFrom:
    - extract:
        key: flux
