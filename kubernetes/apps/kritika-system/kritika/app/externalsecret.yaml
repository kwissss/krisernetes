---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kritika-secret
    template:
      data:
        KRITIKA_AUTH_ADMIN_PASSWORD: "{{ .KRITIKA_ADMIN_PASSWORD }}"
        KRITIKA_PROVIDERS_API_KEY: "{{ .KRITIKA_OPENROUTER_API_KEY }}"
        KRITIKA_GITHUB_CLIENT_ID: "{{ .KRITIKA_GITHUB_CLIENT_ID }}"
        KRITIKA_GITHUB_PRIVATE_KEY: "{{ .KRITIKA_GITHUB_PRIVATE_KEY }}"
        KRITIKA_GITHUB_WEBHOOK_SECRET: "{{ .KRITIKA_GITHUB_WEBHOOK_SECRET }}"
  dataFrom:
    - extract:
        key: kritika
