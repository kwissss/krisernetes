---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim
spec:
  name: filesystem-trim
  task: filesystem-trim
  # Before the 04:00 VolSync backups, so snapshot clones skip freed blocks
  cron: 0 3 * * *
  groups:
    - default
  concurrency: 1
  retain: 0
