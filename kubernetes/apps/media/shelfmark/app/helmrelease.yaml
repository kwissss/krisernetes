---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: shelfmark
  interval: 1h
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark-lite
              tag: v1.5.0@sha256:3631dd9aa5e404e0849bfbef8f30cd86864ab7579118d4defc301b8070472d25
            env:
              FLASK_PORT: &port 80
              TZ: Europe/Oslo
              INGEST_DIR: /mnt/local/Media/Books
              DESTINATION_AUDIOBOOK: /mnt/local/Media/Audiobooks
              FILE_ORGANIZATION: organize
              FILE_ORGANIZATION_AUDIOBOOK: organize
              METADATA_PROVIDER: hardcover
              HARDCOVER_ENABLED: "true"
              PROWLARR_ENABLED: "true"
              PROWLARR_URL: http://prowlarr.media.svc.cluster.local
              PROWLARR_TORRENT_CLIENT: qbittorrent
              QBITTORRENT_URL: http://qbittorrent.media.svc.cluster.local
              QBITTORRENT_CATEGORY: books
              QBITTORRENT_CATEGORY_AUDIOBOOK: audiobooks
              AUTH_METHOD: oidc
              OIDC_DISCOVERY_URL: https://id.kris.party/.well-known/openid-configuration
              OIDC_ADMIN_GROUP: admins
              DISABLE_LOCAL_AUTH: "true"
              OIDC_AUTO_REDIRECT: "true"
              SESSION_COOKIE_SECURE: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.kris.party"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: nas.internal
        path: /volume1/data
        globalMounts:
          - path: /mnt/local
      tmp:
        type: emptyDir
        globalMounts:
          - path: /home/shelfmark
            subPath: home
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: log
