---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
  oidc:
    provider:
      issuer: https://id.kris.party
    clientIDRef:
      name: ${APP}-oidc
    clientSecret:
      name: ${APP}-oidc
    redirectURL: https://${APP}.kris.party/oauth2/callback
